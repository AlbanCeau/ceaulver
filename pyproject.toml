[project]
name = "feng3d"
version = "0.1.0"
readme = "README.md"
description = "A minimal collision solver for the GPU"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "taichi==1.7.4",
    "numpy>=2.0",
]

# Viewer stack for examples/. Installed by default by `uv run` / `uv sync`
# (see default-groups below); not pulled in by `pip install feng3d`.
[dependency-groups]
examples = [
    "moderngl>=5.12.0",
    "moderngl-window[imgui]>=3.1.1",
    "imgui-bundle<1.92",
    "pyglm>=2.8",
    "matplotlib>=3.10",
]

[tool.uv]
default-groups = ["examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feng3d"]
